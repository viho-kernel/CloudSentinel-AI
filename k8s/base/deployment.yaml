apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudsentinel-core
  namespace: cloudsentinel
  labels:
    app.kubernetes.io/name: cloudsentinel
    app.kubernetes.io/component: core-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudsentinel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudsentinel
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8080"
    spec:
      # Pod-level security context
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      containers:
      - name: cloudsentinel-api
        image: gcr.io/cloudsentinel-prod/core-api:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP

        # Container-level strict security context (CIS K8s 5.2)
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          privileged: false
          capabilities:
            drop:
            - ALL

        envFrom:
        - configMapRef:
            name: cloudsentinel-config

        env:
        - name: ENVIRONMENT
          value: "base"
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: cloudsentinel-secrets
              key: gemini-api-key
              optional: true

        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"

        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 2

        volumeMounts:
        - name: tmp-volume
          mountPath: /tmp

      volumes:
      - name: tmp-volume
        emptyDir: {}
