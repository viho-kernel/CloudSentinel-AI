apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cloudsentinel-prod

bases:
  - ../../base

resources:
  - ingress.yaml

nameSuffix: -prod

commonLabels:
  environment: prod

replicas:
  - name: cloudsentinel-core
    count: 3

patches:
  - target:
      kind: ConfigMap
      name: cloudsentinel-config
    patch: |-
      - op: replace
        path: /data/LOG_LEVEL
        value: "WARNING"
  - target:
      kind: Deployment
      name: cloudsentinel-core
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: "prod"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "250m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "256Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "1000m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "1Gi"
