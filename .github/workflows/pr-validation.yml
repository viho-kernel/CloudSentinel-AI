name: "PR Quality & DevSecOps Security Gate"

on:
  pull_request:
    branches: [ develop, main ]
    paths:
      - 'app/**'
      - 'docker/**'
      - 'k8s/**'
      - 'terraform/**'
      - 'tests/**'
      - '.github/workflows/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # Stage 1: Software Quality & Unit Testing
  # ==========================================
  unit-tests:
    name: "🧪 Unit & Integration Testing"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt pytest-cov

      - name: Run Pytest with Coverage Gate (>80%)
        run: |
          pytest tests/unit/ tests/integration/ \
            --cov=app \
            --cov-report=term-missing \
            --cov-fail-under=80

  # ==========================================
  # Stage 2: Static Application Security (SAST)
  # ==========================================
  sast-code-scan:
    name: "🛡️ SAST Security Scan (Bandit)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Bandit SAST Security Auditor
        run: |
          pip install bandit
          # Scans application code for OWASP vulnerabilities
          bandit -r app/ -ll -ii -f screen

  # ==========================================
  # Stage 3: Secret Detection & Leak Prevention
  # ==========================================
  secret-scan:
    name: "🔑 Hardcoded Secret Detection"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run GitLeaks Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==========================================
  # Stage 4: Infrastructure as Code (IaC) Scan
  # ==========================================
  iac-security:
    name: "☁️ IaC & CIS Compliance Scan"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Checkov IaC Security Scanner
        uses: bridgecrewio/checkov-action@master
        with:
          framework: terraform,kubernetes,dockerfile
          output_format: cli
          soft_fail: false

  # ==========================================
  # Stage 5: Container Vulnerability Scan (Trivy)
  # ==========================================
  container-vulnerability-scan:
    name: "🐳 Container Vulnerability Audit (Trivy)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Local Container Image
        run: |
          docker build -f docker/Dockerfile -t cloudsentinel-ci:test .

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'cloudsentinel-ci:test'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
